[package]
name = "tritsim"
version = "0.1.0"
edition = "2021"

[dependencies]
trit-core = { path = "../trit-core" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokenizers = "0.21"

[lib]
name = "tritsim"
path = "src/lib.rs"
