[package]
name = "tritsim"
version = "0.1.0"
edition = "2021"

[dependencies]
trit-core = { path = "../trit-core" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokenizers = "0.21"

[dev-dependencies]
# The production CPU backend, used only to cross-check this oracle against the
# real runtime. Keeping it a dev-dependency preserves the point of having two
# implementations: tritsim's own forward path shares no code with trit-cpu.
trit-cpu = { path = "../trit-cpu" }

[features]
# Hardware-in-the-loop: link the Verilated trit_matvec core (needs verilator).
rtl = []

[lib]
name = "tritsim"
path = "src/lib.rs"
